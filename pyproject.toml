[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-covariance"
version = "0.1.0"
description = "Active pilot sampling and covariance emulation for multi-fidelity stochastic optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Thomas E. Coons"},
  {name = "Aniket Jivani"},
  {name = "Xun Huan"},
]
keywords = [
  "multi-fidelity",
  "approximate control variates",
  "stochastic optimization",
  "pilot sampling",
  "covariance emulation",
  "optimal experimental design",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "pandas>=2.0"]
oed = ["torch>=2.1", "matplotlib>=3.7", "pandas>=2.0"]
mxmcpy = [
  "mxmcpy @ git+https://github.com/nasa/mxmcpy.git@main",
]
paper = [
  "torch>=2.1",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "mxmcpy @ git+https://github.com/nasa/mxmcpy.git@main",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
]

[project.scripts]
adaptive-cov-four-branch = "adaptive_covariance.cli:four_branch_main"
adaptive-cov-paper-plots = "adaptive_covariance.cli:paper_plots_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
